name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Instala Gradle en el runner, así no hace falta subir el gradle wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: donutpay-tracker-jar
          path: build/libs/*.jar
